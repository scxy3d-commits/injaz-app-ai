plugins {
    id 'com.android.application'
}

android {
    namespace 'com.injaz.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.injaz.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file('../keystore/injaz.jks')
            storePassword 'injaz-app-2026'
            keyAlias 'injaz'
            keyPassword 'injaz-app-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
