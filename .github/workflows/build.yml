name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build-log.txt
      - name: Lint
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ./gradlew --no-daemon lintRelease > lint-log.txt 2>&1 || true
          mkdir -p ci-out
          cp app/build/reports/lint-results-release.txt ci-out/lint.txt 2>/dev/null || true
          tail -40 lint-log.txt > ci-out/lint-tail.txt || true
      - name: Enable KVM
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator test (Android 15)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/emu-test.sh
      - name: Publish results to build branch
        if: always()
        run: |
          mkdir -p out
          cp build-log.txt out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/Injaz.apk 2>/dev/null || true
          cp -r ci-out/. out/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > out/commit.txt
          echo "build=${{ steps.build.outcome }}" > out/status.txt
          cd out
          git init -q -b build
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build
      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Injaz-apk
          path: app/build/outputs/apk/release/*.apk
